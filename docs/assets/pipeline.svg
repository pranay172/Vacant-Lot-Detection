<rect x="860" y="512" width="320" height="114" rx="14" class="node" style="stroke:var(--det);stroke-width:2"/>
<text x="888" y="552" class="muted eyebrow">PRIVATE LEADERBOARD</text>
<text x="886" y="602" font-size="44" font-weight="800" class="ink">0.7341</text>
<text x="1050" y="588" font-size="18" font-weight="700" class="ink">7th of 467</text>
<text x="1050" y="610" font-size="15.5" class="ink2">code verified</text>
</svg>