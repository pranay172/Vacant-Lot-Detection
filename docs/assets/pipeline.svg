<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" role="img" aria-labelledby="title desc">
<title id="title">Solution pipeline</title>
<desc id="desc">Two parallel pipelines. Detection: TIFF to PNG and COCO, five augmented copies per image, DINO Swin-L, score threshold 0.35, bbox.json. Segmentation: TIFF to PNG and masks, original plus five augmentations, Mask2Former Swin-L, polygonization, segmentation.json. Detection is scored with F-beta 0.5 and segmentation with F1; the harmonic mean gives 0.7341, 7th of 467.</desc>
<style>
  :root { color-scheme: light dark; }
  svg {
    --ink:#1f2328; --ink2:#59636e; --muted:#818b98; --grid:#eaeef2; --axis:#d1d9e0;
    --node:#ffffff; --stroke:#d1d9e0; --other:#afb8c1; --ring:#ffffff;
    --det:#2a78d6; --seg:#eb6834; --det-tint:rgba(42,120,214,0.08); --seg-tint:rgba(235,104,52,0.08);
    --hero:#0b1220;
  }
  @media (prefers-color-scheme: dark) {
    svg {
      --ink:#f0f6fc; --ink2:#9198a1; --muted:#7d8590; --grid:#21262d; --axis:#3d444d;
      --node:#151b23; --stroke:#3d444d; --other:#545d68; --ring:#0d1117;
      --det:#3987e5; --seg:#d95926; --det-tint:rgba(57,135,229,0.12); --seg-tint:rgba(217,89,38,0.12);
    }
  }
  text { font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
  .mono { font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
  .ink { fill:var(--ink); } .ink2 { fill:var(--ink2); } .muted { fill:var(--muted); }
  .node { fill:var(--node); stroke:var(--stroke); stroke-width:1.5; }
  .edge { stroke:var(--muted); stroke-width:2; fill:none; stroke-linecap:round; stroke-linejoin:round; }
  .arrowhead { fill:var(--muted); }
  .det { fill:var(--det); } .seg { fill:var(--seg); }
  .eyebrow { font-size:13px; letter-spacing:1.6px; font-weight:600; }
</style>
<text x="123.0" y="34" text-anchor="middle" class="muted eyebrow">PREPROCESS</text>
<text x="357.0" y="34" text-anchor="middle" class="muted eyebrow">OFFLINE AUGMENT</text>
<text x="591.0" y="34" text-anchor="middle" class="muted eyebrow">MODEL</text>
<text x="825.0" y="34" text-anchor="middle" class="muted eyebrow">POST-PROCESS</text>
<text x="1068.0" y="34" text-anchor="middle" class="muted eyebrow">OUTPUT</text>
<line x1="20" y1="50" x2="1180" y2="50" style="stroke:var(--grid)" stroke-width="1"/>
<circle cx="27" cy="74" r="6" class="det"/>
<text x="42" y="80" font-size="18" font-weight="700" class="ink">Detection<tspan font-weight="400" font-size="16" class="ink2" dx="10">600 train · 400 eval images · bounding boxes</tspan></text>
<rect x="20" y="96" width="206" height="124" rx="12" class="node"/>
<rect x="36" y="114" width="22" height="4" rx="2" class="det"/>
<text x="36" y="146" font-size="18" font-weight="700" class="ink">TIFF → PNG</text>
<text x="36" y="176" font-size="16" class="ink2">JSON → COCO format</text>
<text x="36" y="199" font-size="16" class="ink2">90/10 split, seed 42</text>
<path d="M230 158.0 H246" class="edge"/>
<path d="M245 153.0 L252 158.0 L245 163.0 Z" class="arrowhead"/>
<rect x="254" y="96" width="206" height="124" rx="12" class="node"/>
<rect x="270" y="114" width="22" height="4" rx="2" class="det"/>
<text x="270" y="146" font-size="18" font-weight="700" class="ink">Augment ×5</text>
<text x="270" y="176" font-size="16" class="ink2">flip · bbox-safe crop</text>
<text x="270" y="199" font-size="16" class="ink2">colour · noise · blur</text>
<path d="M464 158.0 H480" class="edge"/>
<path d="M479 153.0 L486 158.0 L479 163.0 Z" class="arrowhead"/>
<rect x="488" y="96" width="206" height="124" rx="12" class="node" style="fill:var(--det-tint);stroke:var(--det)"/>
<rect x="504" y="114" width="22" height="4" rx="2" class="det"/>
<text x="504" y="146" font-size="18" font-weight="700" class="ink">DINO</text>
<text x="504" y="176" font-size="16" class="ink2">Swin-L · COCO init</text>
<text x="504" y="199" font-size="16" class="ink2">5 epochs · AdamW</text>
<path d="M698 158.0 H714" class="edge"/>
<path d="M713 153.0 L720 158.0 L713 163.0 Z" class="arrowhead"/>
